name: Build, test and publish Ghostty for Windows

# Cross-compiles the Ghostty commit that sources.lock pins (or, on demand, another fork branch)
# for Windows x64 and Arm64 with Zig on Linux, tests the x64 build under Wine on a virtual X
# server, and on a push to main that passes publishes the rolling release <YYYYMMDD>.<N>, as
# rdp-release-kit does: the zips and SHA256SUMS, as GitHub's latest release, published once
# and never replaced. A build whose inputs (the pin, ci/build.sh) are already released
# publishes nothing. A pull request, and a run with "ref", only build and test. What a push
# needs comes from ci/changes.sh: no build when nothing a build reads changed, build and test
# only when the other scripts changed, and the release only when the pin or ci/build.sh did.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', LICENSE]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: Test this fork branch or commit instead of the pin (e.g. integration-windows, before picking it); never published
        default: ''

permissions:
  contents: write

concurrency:
  group: kit-${{ github.ref }}

env:
  ZIG_VERSION: 0.17.1

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          case $EVENT in
            push) scope=$(ci/changes.sh "$BEFORE" "$GITHUB_SHA") ;;
            pull_request) scope=$(ci/changes.sh "$BASE" "$GITHUB_SHA") ;;
            *) scope=release ;;
          esac
          echo "::notice::scope: $scope"
          echo "scope=$scope" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.scope != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: kit

      - name: Resolve the Ghostty commit
        env:
          REF: ${{ inputs.ref }}
        run: kit/ci/resolve.sh kit ghostty "$REF" "$GITHUB_RUN_NUMBER" | tee -a "$GITHUB_ENV"

      - name: Check out the Ghostty commit
        run: git -C ghostty checkout -q "$SHA" && git -C ghostty log -1 --format='%h %s'

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build (x86_64 and aarch64)
        env:
          # The architectures a release cannot go out without (ci/build.sh). Both while the owner
          # uses Windows on Arm (2026-11-23: "be sure arm64 works now"); "x86_64" alone brings
          # back x64 first, where a failed aarch64 is left out of the release and named in its notes.
          MUST_BUILD: x86_64 aarch64
        run: |
          sudo apt-get install -y -q zip > /dev/null
          kit/ci/build.sh ghostty "$VERSION" out x86_64 aarch64

      - name: Test x86_64 under Wine
        run: |
          # WineHQ's stable Wine (11.x), the version the tests pass with: under the runner's
          # own Wine (Ubuntu 26.04's 10.0) ghostty.exe exited before its window appeared,
          # and Ubuntu 24.04's 9.0 showed the window black and unfocused, while the same zip
          # passes under Wine 11.
          # The key is ASCII-armored; apt 3 reads armor only from a .asc file, and the
          # .sources file names winehq-archive.key, so it is stored dearmored.
          sudo dpkg --add-architecture i386
          sudo mkdir -pm755 /etc/apt/keyrings
          wget -q -O- https://dl.winehq.org/wine-builds/winehq.key | sudo gpg --dearmor -o /etc/apt/keyrings/winehq-archive.key
          codename=$(. /etc/os-release && echo "$VERSION_CODENAME")
          sudo wget -q -NP /etc/apt/sources.list.d/ "https://dl.winehq.org/wine-builds/ubuntu/dists/$codename/winehq-$codename.sources"
          sudo apt-get update -q
          sudo apt-get install -y -q --install-recommends winehq-stable > /dev/null
          sudo apt-get install -y -q --no-install-recommends xvfb xauth xdotool imagemagick mesa-utils libgl1-mesa-dri > /dev/null
          wine --version
          exe=out/work/pkg-x86_64/ghostty-$VERSION-windows-x86_64/ghostty.exe
          xvfb-run -a -s "-screen 0 1280x800x24" kit/ci/test-wine.sh "$exe" out/test

      - name: Keep the build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ghostty-${{ env.VERSION }}
          path: |
            out/*.zip
            out/SHA256SUMS
            out/test/test.log
            out/test/*.png
            out/test/ghostty.log
          if-no-files-found: ignore

      - name: Publish the rolling release
        if: env.PINNED == 'true' && needs.changes.outputs.scope == 'release' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The tag is the pin's own release, <YYYYMMDD>.<N> from a version 1.4.1-dev+r<YYYYMMDD>.<N>,
          # so it always matches the fork's release-<YYYYMMDD>.<N>, the zip names, BUILDINFO.txt and the
          # window title, also when a picked release was never published (20261122.6). Counting
          # the day's tags is kept only for a version without +r (none is pinned so far).
          case $VERSION in
          *+r[0-9]*) tag=${VERSION##*+r} ;;
          *)
            day=$(date -u +%Y%m%d)
            n=$(( $(git -C kit ls-remote --tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "refs/tags/$day.*" | wc -l) + 1 ))
            tag=$day.$n
            ;;
          esac
          if ! [[ $tag =~ ^[0-9]{8}\.[0-9]+$ ]]; then echo "::error::no release tag from version $VERSION ($tag)"; exit 1; fi
          key="ghostty $VERSION ${SHA:0:12}, build.sh $(git -C kit rev-parse --short=12 HEAD:ci/build.sh), README.txt $(git -C kit rev-parse --short=12 HEAD:ci/README.txt), about.py $(git -C kit rev-parse --short=12 HEAD:ci/about.py 2> /dev/null || echo none), zig $ZIG_VERSION"
          fork=${SRC#https://github.com/}
          fork=${fork%.git}
          # shellcheck disable=SC2016 # the backticks are Markdown
          {
            echo "Ghostty \`$VERSION\` for Windows, built by ghostty-release-kit \`${GITHUB_SHA:0:12}\` from [\`$REF\`](https://github.com/$fork/tree/$REF) @ \`${SHA:0:12}\` with Zig $ZIG_VERSION, and tested under Wine. An early, unofficial build."
            echo
            echo "**Base:** upstream ghostty-org/ghostty $(git -C ghostty log -1 --format='`%h` %s' "$BASE")"
            echo
            echo "**Our commits on top:**"
            git -C ghostty log --reverse --format='- `%h` %s' "$BASE..$SHA"
            echo
            echo "**Tests** (\`ci/test-wine.sh\`, x86_64 under Wine with Mesa llvmpipe):"
            grep -E '^(ok|#)' out/test/test.log | sed 's/^/- /'
            echo
            if [ -f "out/ghostty-$VERSION-windows-aarch64.zip" ]; then
              echo "**Install:** unzip \`ghostty-$VERSION-windows-x86_64.zip\` (or \`-aarch64\` for Windows on Arm) and run \`ghostty.exe\`. README.txt inside says what works and what does not yet."
            else
              echo "**Install:** unzip \`ghostty-$VERSION-windows-x86_64.zip\` and run \`ghostty.exe\`. README.txt inside says what works and what does not yet."
            fi
            echo
            # An architecture ci/build.sh could not build (x86_64 always builds, or nothing is published).
            if [ -f out/NOT-BUILT ]; then
              while read -r a; do echo "**$a:** not built in this release (build error; fixed in the next)."; echo; done < out/NOT-BUILT
            fi
            echo "Published once, never replaced. <!-- kit-key: $key --> <!-- version: $VERSION -->"
          } > out/notes.md
          cat out/notes.md
          KEY=$key python3 -I kit/ci/publish-release.py "$tag" "$GITHUB_SHA" \
            "Ghostty for Windows $tag" out/notes.md out/*.zip out/SHA256SUMS

  # The probes the Windows job runs (ci/winprobe/*.c), cross-compiled here with the same Zig, one
  # set per architecture; seconds of work, so it runs beside the build.
  winprobes:
    needs: changes
    if: needs.changes.outputs.scope != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Build the probes (x86_64 and aarch64)
        run: |
          for a in x86_64 aarch64; do
            mkdir -p probes/$a
            zig cc -target $a-windows-gnu -O2 ci/winprobe/glprobe.c -lopengl32 -lgdi32 -luser32 -o probes/$a/glprobe.exe
            zig cc -target $a-windows-gnu -O2 ci/winprobe/conpty-probe.c -o probes/$a/conpty-probe.exe
            zig cc -target $a-windows-gnu -O2 ci/winprobe/emit.c -o probes/$a/emit.exe
          done
          rm -f probes/*/*.pdb
          ls -l probes/*
      - uses: actions/upload-artifact@v4
        with:
          name: winprobes
          path: probes/

  # The build on real Windows, which Wine can't show: an interactive desktop or not, the OpenGL
  # the machine gives (and Mesa's software one beside ghostty.exe when that is below 4.3), the
  # side-loaded ConPTY against the in-box one (conpty-probe), Ghostty starting, drawing, typing
  # through ConPTY, and the caption buttons of the maximized window clicked with real mouse input
  # (ci/test-windows.ps1). windows-11-arm is free for public repositories. Results go to the job
  # summary as text.
  windows:
    needs: [build, winprobes]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-11-arm
            arch: aarch64
            mesa: arm64
          - runner: windows-latest
            arch: x86_64
            mesa: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ghostty-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: winprobes
          path: probes
      - name: Mesa's software OpenGL (mmozeiko/build-mesa 26.3.1, llvmpipe and d3d12), checked
        shell: pwsh
        run: |
          # Pinned by SHA-256 (the release's own digests). Only for the test: it shows whether
          # an opengl32.dll beside ghostty.exe gives the 4.3 core context a machine without a
          # GPU driver lacks (a VM's basic display adapter, as on UTM).
          $pins = @{
            'llvmpipe-arm64' = 'c74c960c0416f3fa7f55dd877c34bbb1408f097cdf20a5638cd10ac1c90ae3c5'
            'd3d12-arm64'    = 'd55141861f4f3c9b1495a20830184926f012dc52ac756860707fddf60e15b0ba'
            'llvmpipe-x64'   = '08145a3717e0c1be0d97b74b53070f14eb39cb2f7de22f84fe20d1a581299c12'
            'd3d12-x64'      = '844d490ff220409218b89c9ece52eb4d3674a9bd3786fddbec288c12da606712'
          }
          foreach ($k in 'llvmpipe', 'd3d12') {
            $n = "$k-${{ matrix.mesa }}"
            $f = "mesa-$n-26.3.1.7z"
            curl.exe -fsSL --retry 3 -o $f "https://github.com/mmozeiko/build-mesa/releases/download/26.3.1/$f"
            $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            if ($h -ne $pins[$n]) { throw "$f differs from its pin ($h)" }
            New-Item -ItemType Directory -Force "mesa/$k" | Out-Null
            if (Get-Command 7z -ErrorAction SilentlyContinue) { 7z x -y -o"mesa/$k" $f opengl32.dll | Out-Null }
            else { tar -xf $f -C "mesa/$k" opengl32.dll }
            Get-ChildItem "mesa/$k"
          }
      - name: Test on real Windows (${{ matrix.runner }}, ${{ matrix.arch }})
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist -Filter "*-windows-${{ matrix.arch }}.zip" | Select-Object -First 1
          if (-not $zip) { throw "no ${{ matrix.arch }} zip in the build artifact: $((Get-ChildItem dist).Name -join ', ')" }
          ./ci/test-windows.ps1 -Zip $zip.FullName -Probes probes/${{ matrix.arch }} -Out wintest -Mesa mesa -CompatPack
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wintest-${{ matrix.arch }}
          path: |
            wintest/results.md
            wintest/ghostty.log
            wintest/conpty-*.txt
            wintest/gl-*/glprobe.txt
          if-no-files-found: ignore
