name: Build, test and publish Ghostty for Windows

# Cross-compiles the Ghostty commit that sources.lock pins (or, on demand, another fork branch)
# for Windows x64 and Arm64 with Zig on Linux, once (build); then tests those very zips in
# parallel: x86_64 under Wine, the full set in ci/wine/ (wine-x64); both on real Windows,
# windows-latest and windows-11-arm (windows). (An aarch64-under-Wine job on an arm64 Linux
# runner was dropped on 2026-11-24: the distribution's Wine 9.0 never finished creating its
# prefix there, wineboot hung until the job's cap, and real Windows on Arm tests aarch64.) The gate job gives the run one verdict: the build and every job in MUST_TEST
# passed; it also lists each job's minutes. On a push to main that passes the gate, publish
# makes the rolling release <YYYYMMDD>.<N>, as rdp-release-kit does: the zips and SHA256SUMS,
# as GitHub's latest release, published once and never replaced. A build whose inputs (the pin,
# ci/build.sh, ci/about.py) are already released publishes nothing. A pull request, and a run
# with "ref", only build and test. What a push needs comes from ci/changes.sh: no build when
# nothing a build reads changed, build and test only when the other scripts changed, and the
# release only when the pin or the package's inputs did. Only GitHub's free standard runners.
on:
  push:
    branches: [main]
    paths-ignore: ['**.md', LICENSE]
  pull_request:
  workflow_dispatch:
    inputs:
      ref:
        description: Test this fork branch or commit instead of the pin (e.g. integration-windows, before picking it); never published
        default: ''
      whatsnew:
        description: What's new text for this test build (shown once by ghostty.exe after an upgrade); a release's notes are its sources.lock paragraph
        default: ''

permissions:
  contents: write
  actions: read

concurrency:
  group: kit-${{ github.ref }}

env:
  ZIG_VERSION: 0.17.1
  # The test jobs the gate requires (and so a release): their job ids. The others run and are
  # reported.
  MUST_TEST: wine-x64 windows

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: scope
        env:
          EVENT: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          case $EVENT in
            push) scope=$(ci/changes.sh "$BEFORE" "$GITHUB_SHA") ;;
            pull_request) scope=$(ci/changes.sh "$BASE" "$GITHUB_SHA") ;;
            *) scope=release ;;
          esac
          echo "::notice::scope: $scope"
          echo "scope=$scope" >> "$GITHUB_OUTPUT"

  # One build of both architectures; its zips are the artifact every test job takes, so what is
  # tested is what is published.
  build:
    needs: changes
    if: needs.changes.outputs.scope != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    outputs:
      VERSION: ${{ steps.resolve.outputs.VERSION }}
      SHA: ${{ steps.resolve.outputs.SHA }}
      BASE: ${{ steps.resolve.outputs.BASE }}
      SRC: ${{ steps.resolve.outputs.SRC }}
      REF: ${{ steps.resolve.outputs.REF }}
      PINNED: ${{ steps.resolve.outputs.PINNED }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: kit

      - name: Resolve the Ghostty commit
        id: resolve
        env:
          REF: ${{ inputs.ref }}
        run: kit/ci/resolve.sh kit ghostty "$REF" "$GITHUB_RUN_NUMBER" | tee -a "$GITHUB_ENV" "$GITHUB_OUTPUT"

      - name: Check out the Ghostty commit
        run: git -C ghostty checkout -q "$SHA" && git -C ghostty log -1 --format='%h %s'

      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}

      - name: Build (x86_64 and aarch64)
        env:
          # The architectures a release cannot go out without (ci/build.sh). Both while the owner
          # uses Windows on Arm (2026-11-23: "be sure arm64 works now"); "x86_64" alone brings
          # back x64 first, where a failed aarch64 is left out of the release and named in its notes.
          MUST_BUILD: x86_64 aarch64
          WHATSNEW_TEXT: ${{ inputs.whatsnew }}
        run: |
          sudo apt-get install -y -q zip p7zip-full > /dev/null
          kit/ci/build.sh ghostty "$VERSION" out x86_64 aarch64

      - name: The commits, for the release notes
        run: |
          {
            if [ "$BASE" != - ]; then
              echo "**Base:** upstream ghostty-org/ghostty $(git -C ghostty log -1 --format='`%h` %s' "$BASE")"
              echo
              echo "**Our commits on top:**"
              git -C ghostty log --reverse --format='- `%h` %s' "$BASE..$SHA"
            fi
          } > out/commits.md

      - name: Keep the build
        uses: actions/upload-artifact@v4
        with:
          name: ghostty-${{ env.VERSION }}
          path: |
            out/*.zip
            out/SHA256SUMS
            out/NOT-BUILT
            out/commits.md
          if-no-files-found: ignore

  # x86_64 under Wine on a virtual X server (Mesa llvmpipe): ci/test-wine.sh first (window,
  # typing through ConPTY, drawing, exit), then the rest of ci/wine/ (tabs, themes, the stats
  # pipe, the shell, the title bar and its menu, ConPTY's choices, notifications, About).
  wine-x64:
    needs: [build, winprobes]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ghostty-${{ needs.build.outputs.VERSION }}
          path: dist
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: winprobes
          path: probes
      - name: Wine (WineHQ stable) and the test tools
        run: ci/wine/install-wine.sh winehq
      - name: Test x86_64 under Wine
        env:
          VERSION: ${{ needs.build.outputs.VERSION }}
        run: |
          unzip -q "dist/ghostty-$VERSION-windows-x86_64.zip" -d pkg
          tag=$(case $VERSION in *+r[0-9]*) echo "${VERSION##*+r}" ;; *) sha=${{ needs.build.outputs.SHA }}; echo "${sha:0:9}" ;; esac)
          set +e
          # The helpers (ci/wine/helpers/*.c) are built by run-all.sh with the zig set up above.
          ci/wine/run-all.sh "pkg/ghostty-$VERSION-windows-x86_64" wine-x64 "$tag"
          rc=$?
          # End to end through the test-control pipe (ci/e2e-wine.sh, ci/winprobe/e2e.c).
          xvfb-run -a -s "-screen 0 1280x800x24" ci/e2e-wine.sh "pkg/ghostty-$VERSION-windows-x86_64/ghostty.exe" probes/x86_64 wine-x64/e2e > wine-x64/e2e.out 2>&1
          e2e=$?
          { echo "| e2e | $([ $e2e = 0 ] && echo PASS || echo "FAIL (exit $e2e)") | | $(tail -1 wine-x64/e2e.out) |"; } >> wine-x64/summary.md
          cat wine-x64/summary.md >> "$GITHUB_STEP_SUMMARY"
          [ $rc = 0 ] && [ $e2e = 0 ]
      - name: Leave out the Wine prefixes (their dosdevices links reach /, which the upload would walk)
        if: always()
        run: find wine-x64 -name wineprefix -type d -prune -exec rm -rf {} + 2> /dev/null || true
      - name: Keep the results
        if: always()
        continue-on-error: true # the test's verdict is the step above; a lost upload is no test failure
        uses: actions/upload-artifact@v4
        with:
          name: wine-x64
          path: |
            wine-x64/summary.md
            wine-x64/*.out
            wine-x64/**/*.log
            wine-x64/**/*.txt
          if-no-files-found: ignore

  # The probes the Windows job runs (ci/winprobe/*.c), cross-compiled here with the same Zig, one
  # set per architecture; seconds of work, so it runs beside the build.
  winprobes:
    needs: changes
    if: needs.changes.outputs.scope != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
        with:
          version: ${{ env.ZIG_VERSION }}
      - name: Build the probes (x86_64 and aarch64)
        run: |
          for a in x86_64 aarch64; do
            mkdir -p probes/$a
            zig cc -target $a-windows-gnu -O2 ci/winprobe/glprobe.c -lopengl32 -lgdi32 -luser32 -o probes/$a/glprobe.exe
            zig cc -target $a-windows-gnu -O2 ci/winprobe/conpty-probe.c -o probes/$a/conpty-probe.exe
            zig cc -target $a-windows-gnu -O2 ci/winprobe/emit.c -o probes/$a/emit.exe
            zig cc -target $a-windows-gnu -O2 ci/winprobe/e2e.c -o probes/$a/e2e.exe
            zig cc -target $a-windows-gnu -O2 ci/winprobe/catbench.c -o probes/$a/catbench.exe
            zig cc -target $a-windows-gnu -O2 ci/winprobe/demo.c -lole32 -lwindowscodecs -lshlwapi -ldwmapi -luser32 -lgdi32 -o probes/$a/demo.exe
          done
          rm -f probes/*/*.pdb
          ls -l probes/*
      - uses: actions/upload-artifact@v4
        with:
          name: winprobes
          path: probes/

  # The build on real Windows, which Wine can't show: an interactive desktop or not, the OpenGL
  # the machine gives (and Mesa's software one beside ghostty.exe when that is below 4.3), the
  # side-loaded ConPTY against the in-box one (conpty-probe), Ghostty starting, drawing, typing
  # through ConPTY, and the caption buttons of the maximized window clicked with real mouse input
  # (ci/test-windows.ps1). windows-11-arm is free for public repositories. Results go to the job
  # summary as text.
  windows:
    needs: [build, winprobes]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-11-arm
            arch: aarch64
            mesa: arm64
          - runner: windows-latest
            arch: x86_64
            mesa: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ghostty-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: winprobes
          path: probes
      - name: Mesa's software OpenGL (mmozeiko/build-mesa 26.3.1, llvmpipe and d3d12), checked
        shell: pwsh
        run: |
          # Pinned by SHA-256 (the release's own digests). Only for the test: it shows whether
          # an opengl32.dll beside ghostty.exe gives the 4.3 core context a machine without a
          # GPU driver lacks (a VM's basic display adapter, as on UTM).
          $pins = @{
            'llvmpipe-arm64' = 'c74c960c0416f3fa7f55dd877c34bbb1408f097cdf20a5638cd10ac1c90ae3c5'
            'd3d12-arm64'    = 'd55141861f4f3c9b1495a20830184926f012dc52ac756860707fddf60e15b0ba'
            'llvmpipe-x64'   = '08145a3717e0c1be0d97b74b53070f14eb39cb2f7de22f84fe20d1a581299c12'
            'd3d12-x64'      = '844d490ff220409218b89c9ece52eb4d3674a9bd3786fddbec288c12da606712'
          }
          foreach ($k in 'llvmpipe', 'd3d12') {
            $n = "$k-${{ matrix.mesa }}"
            $f = "mesa-$n-26.3.1.7z"
            curl.exe -fsSL --retry 3 -o $f "https://github.com/mmozeiko/build-mesa/releases/download/26.3.1/$f"
            $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
            if ($h -ne $pins[$n]) { throw "$f differs from its pin ($h)" }
            New-Item -ItemType Directory -Force "mesa/$k" | Out-Null
            if (Get-Command 7z -ErrorAction SilentlyContinue) { 7z x -y -o"mesa/$k" $f opengl32.dll | Out-Null }
            else { tar -xf $f -C "mesa/$k" opengl32.dll }
            Get-ChildItem "mesa/$k"
          }
      - name: Test on real Windows (${{ matrix.runner }}, ${{ matrix.arch }})
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist -Filter "*-windows-${{ matrix.arch }}.zip" | Select-Object -First 1
          if (-not $zip) { throw "no ${{ matrix.arch }} zip in the build artifact: $((Get-ChildItem dist).Name -join ', ')" }
          ./ci/test-windows.ps1 -Zip $zip.FullName -Probes probes/${{ matrix.arch }} -Out wintest -Mesa mesa -CompatPack
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wintest-${{ matrix.arch }}
          path: |
            wintest/results.md
            wintest/ghostty.log
            wintest/conpty-*.txt
            wintest/gl-*/glprobe.txt
            wintest/e2e/*.log
            wintest/fonts/ghostty.log
            wintest/fonts/shot.png
            wintest/fonts.stdout
            wintest/fonts.stderr
            wintest/fonts/*.json
            wintest/after-typing.bmp
          if-no-files-found: ignore

  # One verdict per run: every job named in MUST_TEST passed (the other test jobs are reported,
  # not required), and each job's minutes, so the cost of the loop is on every run's page.
  gate:
    needs: [changes, build, wine-x64, windows, pypi-test, installer-test]
    if: always() && needs.build.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      NEEDS: ${{ toJSON(needs) }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Required tests (MUST_TEST) and the minutes
        run: |
          {
            echo "### Gate: MUST_TEST = $MUST_TEST"
            echo
            echo "| job | result | required |"
            echo "|---|---|---|"
            for j in build wine-x64 windows pypi-test installer-test; do
              r=$(jq -r --arg j "$j" '.[$j].result' <<< "$NEEDS")
              req=no; case " build $MUST_TEST " in *" $j "*) req=yes ;; esac
              echo "| $j | $r | $req |"
            done
            echo
            echo "| job (runner) | minutes |"
            echo "|---|---|"
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/jobs?per_page=50" \
              -q '.jobs[] | select(.completed_at != null) | "| \(.name) (\(.labels | join(","))) | \(((.completed_at | fromdateiso8601) - (.started_at | fromdateiso8601)) / 60 * 10 | floor / 10) |"'
          } >> "$GITHUB_STEP_SUMMARY"
          cat "$GITHUB_STEP_SUMMARY"
          bad=
          for j in build $MUST_TEST; do
            r=$(jq -r --arg j "$j" '.[$j].result' <<< "$NEEDS")
            [ "$r" = success ] || bad="$bad $j=$r"
          done
          if [ -n "$bad" ]; then echo "::error::required jobs did not pass:$bad"; exit 1; fi
          echo "::notice::gate green: build and $MUST_TEST passed"

  # On a push to main whose pin or package inputs changed, and only when the gate is green: the
  # rolling release <YYYYMMDD>.<N>, published once and never replaced.
  publish:
    needs: [changes, build, gate, installer-test]
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    # always(): without a status function GitHub adds success(), which checks every job upstream
    # (also the ones the gate does not require), so a red windows job would skip the release.
    if: always() && needs.gate.result == 'success' && needs.build.outputs.PINNED == 'true' && needs.changes.outputs.scope == 'release' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.build.outputs.VERSION }}
      SHA: ${{ needs.build.outputs.SHA }}
      SRC: ${{ needs.build.outputs.SRC }}
      REF: ${{ needs.build.outputs.REF }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: kit
      - uses: actions/download-artifact@v4
        with:
          name: ghostty-${{ needs.build.outputs.VERSION }}
          path: out
      - uses: actions/download-artifact@v4
        with:
          name: wine-x64
          path: out/wine-x64
      # The installers (installer/ghostty.iss), when they were built; the release goes out
      # without them otherwise.
      - uses: actions/download-artifact@v4
        # The installers join a release only when installer-test passed on both architectures.
        if: needs.installer-test.result == 'success'
        continue-on-error: true
        with:
          name: installers
          path: out/installers
      # The feature demos (ci/demo/): only a set a person has looked at, frame by frame. The
      # repository variable DEMOS_OK names the run whose demos were approved after that look (its
      # OCR check passed too, or the artifact would not exist); they are taken from that run.
      # Unset, or that run's artifact gone: the release goes out without demos. A run's own demos
      # are never published on its automatic check alone (run 45298827734: the check passed
      # frames the look refused).
      - name: The approved demos (vars.DEMOS_OK)
        if: vars.DEMOS_OK != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEMOS_OK: ${{ vars.DEMOS_OK }}
          # The families that passed the look, e.g. "workspace look commands"; unset = all of them.
          # With a list, only those GIFs ship, and demo-all.mp4 (every scene) never does.
          DEMOS_FAMILIES: ${{ vars.DEMOS_FAMILIES }}
        run: |
          gh run download "$DEMOS_OK" -R "$GITHUB_REPOSITORY" -n demos -D out/demos
          if [ -n "$DEMOS_FAMILIES" ]; then
            rm -f out/demos/demo-all.mp4
            for f in out/demos/demo-*.gif; do
              fam=$(basename "$f" .gif); fam=${fam#demo-}; fam=${fam#[0-9]-}
              case " $DEMOS_FAMILIES " in *" $fam "*) ;; *) rm -f "$f" ;; esac
            done
          fi
          ls -l out/demos
      - name: Publish the rolling release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The tag is the pin's own release, <YYYYMMDD>.<N> from a version 1.4.1-dev+r<YYYYMMDD>.<N>,
          # so it always matches the fork's release-<YYYYMMDD>.<N>, the zip names, BUILDINFO.txt and the
          # window title, also when a picked release was never published (20261122.6). Counting
          # the day's tags is kept only for a version without +r (none is pinned so far).
          case $VERSION in
          *+r[0-9]*) tag=${VERSION##*+r} ;;
          *)
            day=$(date -u +%Y%m%d)
            n=$(( $(git -C kit ls-remote --tags "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" "refs/tags/$day.*" | wc -l) + 1 ))
            tag=$day.$n
            ;;
          esac
          if ! [[ $tag =~ ^[0-9]{8}\.[0-9]+$ ]]; then echo "::error::no release tag from version $VERSION ($tag)"; exit 1; fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          key="ghostty $VERSION ${SHA:0:12}, build.sh $(git -C kit rev-parse --short=12 HEAD:ci/build.sh), README.txt $(git -C kit rev-parse --short=12 HEAD:ci/README.txt), about.py $(git -C kit rev-parse --short=12 HEAD:ci/about.py 2> /dev/null || echo none), notices $(git -C kit rev-parse --short=12 HEAD:ci/THIRD-PARTY-NOTICES-mesa.txt 2> /dev/null || echo none), installer $(git -C kit rev-parse --short=12 HEAD:installer/ghostty.iss 2> /dev/null || echo none), zig $ZIG_VERSION"
          fork=${SRC#https://github.com/}
          fork=${fork%.git}
          testlog=$(find out/wine-x64 -path '*test-wine*/test.log' | head -1)
          # shellcheck disable=SC2016 # the backticks are Markdown
          {
            echo "Ghostty \`$VERSION\` for Windows, built by ghostty-release-kit \`${GITHUB_SHA:0:12}\` from [\`$REF\`](https://github.com/$fork/tree/$REF) @ \`${SHA:0:12}\` with Zig $ZIG_VERSION, and tested under Wine. An early, unofficial build."
            echo
            # What's new: the release's own sources.lock paragraph, the text ghostty.exe shows.
            whatsnew=$(python3 -I kit/ci/about.py whatsnew kit/sources.lock "$VERSION")
            if [ -n "$whatsnew" ]; then echo "**What's new:**"; echo; printf '%s\n' "$whatsnew"; echo; fi
            cat out/commits.md
            echo
            echo "**Tests** (\`ci/test-wine.sh\`, x86_64 under Wine with Mesa llvmpipe; the full set: \`ci/wine/\`, all required by the gate):"
            [ -n "$testlog" ] && grep -E '^(ok|#)' "$testlog" | sed 's/^/- /'
            echo
            if [ -f "out/ghostty-$VERSION-windows-aarch64.zip" ]; then
              echo "**Install:** unzip \`ghostty-$VERSION-windows-x86_64.zip\` (or \`-aarch64\` for Windows on Arm) and run \`ghostty.exe\`. README.txt inside says what works and what does not yet."
            else
              echo "**Install:** unzip \`ghostty-$VERSION-windows-x86_64.zip\` and run \`ghostty.exe\`. README.txt inside says what works and what does not yet."
            fi
            echo
            # An architecture ci/build.sh could not build and MUST_BUILD did not require.
            if [ -f out/NOT-BUILT ]; then
              while read -r a; do echo "**$a:** not built in this release (build error; fixed in the next)."; echo; done < out/NOT-BUILT
            fi
            echo "Published once, never replaced. <!-- kit-key: $key --> <!-- version: $VERSION -->"
          } > out/notes.md
          cat out/notes.md
          setups=$(ls out/installers/*-setup.exe 2> /dev/null || true)
          demos=$(ls out/demos/demo-*.gif out/demos/demo-all.mp4 2> /dev/null || true)
          if [ -n "$setups" ]; then (cd out/installers && sha256sum -- *-setup.exe) >> out/SHA256SUMS; fi
          # shellcheck disable=SC2086 # one word per installer
          KEY=$key python3 -I kit/ci/publish-release.py "$tag" "$GITHUB_SHA" \
            "Ghostty for Windows $tag" out/notes.md out/*.zip $setups $demos out/SHA256SUMS

  # ghostty-for-windows on PyPI (pypi/): the launcher package, repacked into one wheel per
  # architecture with the build's whole zip inside (pypi/bundle.py). Its version is the
  # release's tag (20261123.1, from the version's +r part); a test build is 0.dev<run>.
  pypi:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERSION: ${{ needs.build.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ghostty-${{ needs.build.outputs.VERSION }}
          path: out
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: Build the wheels (win_amd64, win_arm64)
        run: |
          case $VERSION in
          *+r[0-9]*) v=${VERSION##*+r} ;;
          *) v=0.dev$GITHUB_RUN_NUMBER ;;
          esac
          echo "__version__ = \"$v\"" > pypi/src/ghostty_for_windows/_version.py
          (cd pypi && uv build --wheel -o ../plain)
          python3 -I pypi/bundle.py plain/ghostty_for_windows-*-py3-none-any.whl wheels out/*-windows-*.zip
          uvx twine check wheels/*.whl
          ls -l wheels
          # Each wheel's size and the release's total: what one release adds to the PyPI project.
          {
            echo "### PyPI wheels of this build"
            echo
            echo "| wheel | MB |"
            echo "|---|---|"
            for w in wheels/*.whl; do echo "| $(basename "$w") | $(python3 -I -c "import os,sys; print(f'{os.path.getsize(sys.argv[1]) / 1e6:.1f}')" "$w") |"; done
            echo "| **this release adds** | $(python3 -I -c "import glob,os; print(f'{sum(os.path.getsize(w) for w in glob.glob(\"wheels/*.whl\")) / 1e6:.1f}')") |"
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: pypi-wheels
          path: wheels/

  # Each wheel installed as a user would (uv tool install, from the folder of wheels, so uv
  # picks the wheel of the machine), then its command, `ghostty`, asked for /buildinfo; and
  # once more as uvx runs it, without installing.
  pypi-test:
    needs: pypi
    strategy:
      fail-fast: false
      matrix:
        runner: [windows-latest, windows-11-arm]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-wheels
          path: wheels
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      - name: uv tool install, then ghostty /buildinfo
        shell: pwsh
        run: |
          $v = (Get-ChildItem wheels -Filter *.whl | Select-Object -First 1).Name.Split('-')[1]
          uv tool install --no-index --find-links wheels "ghostty-for-windows==$v"
          if ($LASTEXITCODE) { throw "uv tool install failed" }
          $dir = (uv tool dir).Trim()
          $exe = Get-ChildItem "$dir\ghostty-for-windows" -Recurse -Filter ghostty.exe | Select-Object -First 1
          $b = [IO.File]::ReadAllBytes($exe.FullName); $pe = [BitConverter]::ToInt32($b, 0x3C)
          "installed: $($exe.FullName), machine 0x{0:X4}" -f [BitConverter]::ToUInt16($b, $pe + 4)
          $bin = (uv tool dir --bin).Trim()
          $cmd = Get-Command ghostty -ErrorAction SilentlyContinue
          "ghostty on PATH: $($cmd.Source) (uv's tool bin: $bin)"
          $p = Start-Process -FilePath "$bin\ghostty.exe" -ArgumentList '/buildinfo' -RedirectStandardOutput installed.txt -NoNewWindow -PassThru -Wait
          $text = Get-Content installed.txt -Raw
          "--- ghostty /buildinfo (exit $($p.ExitCode)):"; $text
          if ($text -notmatch 'version: ') { throw "ghostty /buildinfo printed no version line" }
          $p = Start-Process -FilePath uvx -ArgumentList @('--no-index', '--find-links', 'wheels', '--from', "ghostty-for-windows==$v", 'ghostty', '/buildinfo') -RedirectStandardOutput uvx.txt -NoNewWindow -PassThru -Wait
          $text = Get-Content uvx.txt -Raw
          "--- uvx --from ghostty-for-windows ghostty /buildinfo (exit $($p.ExitCode)):"; $text
          if ($text -notmatch 'version: ') { throw "uvx ... ghostty /buildinfo printed no version line" }
          "ok: ghostty starts the bundled ghostty.exe, installed and by uvx"
          "| wheel | runner | result |" >> $env:GITHUB_STEP_SUMMARY
          "|---|---|---|" >> $env:GITHUB_STEP_SUMMARY
          "| ghostty-for-windows $v | ${{ matrix.runner }} | /buildinfo ok |" >> $env:GITHUB_STEP_SUMMARY

  # After the GitHub release, by trusted publishing (no token): PyPI's publisher for this
  # project names this repository, this workflow (kit.yml) and the environment "pypi". A wheel
  # already on PyPI (the release was published before) is skipped.
  publish-pypi:
    needs: [publish, pypi, pypi-test]
    # Off until the owner turns it on (a new public channel): the repository variable PYPI = on,
    # after PyPI's pending publisher and the "pypi" environment exist.
    if: always() && vars.PYPI == 'on' && needs.publish.result == 'success' && needs.pypi-test.result == 'success' && needs.publish.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pypi-wheels
          path: wheels
      - name: The wheels are this release's
        env:
          TAG: ${{ needs.publish.outputs.tag }}
        run: |
          ls wheels
          for w in wheels/*.whl; do case $(basename "$w") in ghostty_for_windows-"$TAG"-py3-none-win_*.whl) ;; *) echo "::error::$w is not version $TAG"; exit 1 ;; esac; done
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: wheels/
          skip-existing: true
      - name: The project's size on PyPI (limit 10 GB; warn at 7 GB, to ask PyPI for more in time)
        if: always()
        run: |
          # PyPI's JSON API lists every file of every release with its size; the CDN may lag a
          # minute behind the upload, so a just-uploaded release can be missing from the sum.
          bytes=$(curl -fsSL --retry 3 https://pypi.org/pypi/ghostty-for-windows/json |
            python3 -I -c 'import json,sys; d=json.load(sys.stdin); print(sum(f["size"] for r in d["releases"].values() for f in r))')
          gb=$(python3 -I -c "print(f'{$bytes / 1e9:.2f}')")
          echo "### PyPI: ghostty-for-windows is $gb GB of its 10 GB limit" >> "$GITHUB_STEP_SUMMARY"
          if python3 -I -c "import sys; sys.exit(0 if $bytes >= 7e9 else 1)"; then
            echo "::warning::ghostty-for-windows on PyPI is $gb GB, past 7 GB of the 10 GB limit: ask PyPI for more"
          fi

  # The per-user installers (installer/ghostty.iss), one per architecture, made by Inno Setup
  # on a Windows runner from the build's zips. Inno Setup 6.7.4 is fetched from its GitHub
  # release and checked against its SHA-256, then installed for this user only.
  installer:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      VERSION: ${{ needs.build.outputs.VERSION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: ghostty-${{ needs.build.outputs.VERSION }}
          path: out
      - name: Inno Setup 6.7.4
        shell: pwsh
        run: |
          $f = "$env:RUNNER_TEMP\innosetup-6.7.4.exe"
          curl.exe -fsSL --retry 3 -o $f https://github.com/jrsoftware/issrc/releases/download/is-6_7_4/innosetup-6.7.4.exe
          $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
          if ($h -ne 'a549929319f9120716677c685535ca4671e4b937b5fdc87e2585f32d8eb30e8c') { throw "innosetup-6.7.4.exe differs from its pin ($h)" }
          $dir = "$env:RUNNER_TEMP\inno"
          Start-Process -FilePath $f -ArgumentList @('/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/CURRENTUSER', "/DIR=$dir") -Wait
          if (-not (Test-Path "$dir\ISCC.exe")) { throw "no ISCC.exe in $dir" }
          "ISCC=$dir\ISCC.exe" >> $env:GITHUB_ENV
      - name: Build the installers (x86_64, aarch64)
        shell: pwsh
        run: |
          $tag = if ($env:VERSION -match '\+r(\d{8}\.\d+)$') { $Matches[1] } else { "0.dev$env:GITHUB_RUN_NUMBER" }
          $fv = if ($tag -match '^(\d{4})(\d{2})(\d{2})\.(\d+)$') { '{0}.{1}.{2}.{3}' -f [int]$Matches[1], [int]$Matches[2], [int]$Matches[3], [int]$Matches[4] } else { '0.0.0.0' }
          New-Item -ItemType Directory -Force installers | Out-Null
          foreach ($zip in Get-ChildItem out -Filter '*-windows-*.zip') {
            $arch = if ($zip.Name -match '-windows-(x86_64|aarch64)\.zip$') { $Matches[1] } else { continue }
            $stage = "$env:RUNNER_TEMP\stage-$arch"
            Expand-Archive $zip.FullName -DestinationPath $stage -Force
            $src = (Get-ChildItem $stage -Directory | Select-Object -First 1).FullName
            & $env:ISCC /Q "/DVersion=$tag" "/DFileVersion=$fv" "/DArch=$arch" "/DSrc=$src" "/DOut=$PWD\installers" installer\ghostty.iss
            if ($LASTEXITCODE) { throw "ISCC failed for $arch ($LASTEXITCODE)" }
          }
          Get-ChildItem installers | ForEach-Object { "{0}  {1} bytes" -f $_.Name, $_.Length }
          "### Installers`n" >> $env:GITHUB_STEP_SUMMARY
          Get-ChildItem installers | ForEach-Object { "- ``$($_.Name)``: $([math]::Round($_.Length / 1MB, 1)) MB" } >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        with:
          name: installers
          path: installers/

  # Each installer on its own architecture: install silently (no admin), check the files, the
  # Apps & features entry, the Start-menu shortcut and its AppUserModelID, "Open Ghostty here",
  # start ghostty.exe, install over it while it runs, uninstall silently, nothing left
  # (ci/test-installer.ps1).
  installer-test:
    needs: [installer, winprobes]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x86_64
          - runner: windows-11-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: installers
          path: installers
      - uses: actions/download-artifact@v4
        with:
          name: winprobes
          path: probes
      - name: Install, run, upgrade, uninstall (${{ matrix.arch }})
        shell: pwsh
        run: |
          $setup = Get-ChildItem installers -Filter "*-windows-${{ matrix.arch }}-setup.exe" | Select-Object -First 1
          if (-not $setup) { throw "no ${{ matrix.arch }} installer" }
          ./ci/test-installer.ps1 -Setup $setup.FullName -Out installer-test -Probes probes/${{ matrix.arch }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: installer-test-${{ matrix.arch }}
          path: installer-test/

  # Throughput, a trend line: catbench.exe writes 50 MB of coloured lines in Ghostty, in
  # Windows' own console and in Windows Terminal where the runner has it
  # (ci/bench-throughput.ps1). No GPU here and a shared CPU: not a claim, and never a gate.
  bench:
    needs: [build, winprobes]
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            arch: x86_64
          - runner: windows-11-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ghostty-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: winprobes
          path: probes
      - name: Throughput (${{ matrix.arch }})
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist -Filter "*-windows-${{ matrix.arch }}.zip" | Select-Object -First 1
          ./ci/bench-throughput.ps1 -Zip $zip.FullName -Probes probes/${{ matrix.arch }} -Out bench
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-${{ matrix.arch }}
          path: bench/bench.json

  # The feature demos, one GIF per family (ci/demo/scenes/<n>-<family>.scene) and one MP4: recorded
  # on a GitHub runner (never anyone's desktop) through the test pipe by demo.exe, then read
  # frame by frame for names and paths (ci/demo/privacy-check.py). Publishing takes only a set a
  # person approved after looking at every frame (vars.DEMOS_OK, the approved run). Never a gate.
  demo:
    needs: [build, winprobes]
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ghostty-*
          path: dist
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: winprobes
          path: probes
      - name: Record the scenes
        shell: pwsh
        run: |
          $zip = Get-ChildItem dist -Filter '*-windows-x86_64.zip' | Select-Object -First 1
          Expand-Archive $zip.FullName -DestinationPath pkg
          $exe = (Get-ChildItem pkg -Recurse -Filter ghostty.exe | Select-Object -First 1).FullName
          New-Item -ItemType Directory -Force C:\demo | Out-Null
          Copy-Item ci\demo\agents\*.ps1 C:\demo\   # the agents scene's two little agents
          # The words no frame may show: the machine's name and the user's.
          "$env:COMPUTERNAME $env:USERNAME" | Set-Content machine.txt -Encoding utf8
          # A neutral shell: the prompt is "PS> ", in C:\demo, every tab titled "PowerShell" (no
          # "Administrator: C:\Program Files\..." before the shell starts). No history and no
          # grey prediction from it: PSReadLine's history is per user, so one scene's commands
          # showed up in the next (run 45310313404). No global Quick Terminal key: on the runner
          # something holds Win+`, and the bar would say so (lane A).
          $init = "function prompt { 'PS> ' }; try { Set-PSReadLineOption -HistorySaveStyle SaveNothing -PredictionSource None } catch {}; Set-Location C:\demo; Clear-Host"
          $enc = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($init))
          ./probes/x86_64/demo.exe $exe ci\demo\scenes frames -- "--command=pwsh -NoLogo -NoProfile -NoExit -EncodedCommand $enc" "--working-directory=C:\demo" "--title=PowerShell" "--window-padding-x=10" "--keybind=global:super+grave_accent=unbind"
          Get-ChildItem frames -Directory | ForEach-Object { "{0}: {1} frames" -f $_.Name, (Get-ChildItem $_.FullName -Filter 'f*').Count }
      - uses: actions/upload-artifact@v4
        with:
          name: demo-frames
          path: |
            frames/
            !frames/*/appdata/
            machine.txt

  demo-assemble:
    needs: demo
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: demo-frames
          path: rec
      - run: sudo apt-get install -y -q ffmpeg tesseract-ocr > /dev/null
      - name: Every frame read for names and paths
        run: python3 -I -X utf8 ci/demo/privacy-check.py rec/frames rec/machine.txt | tee privacy.txt
      - name: The GIFs and the MP4
        run: |
          ci/demo/assemble.sh rec/frames demos
          {
            echo "### Demos (privacy check passed)"
            echo
            ls -l demos | awk 'NR > 1 { printf "- `%s`: %.1f MB\n", $9, $5 / 1048576 }'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: demos
          path: demos/
