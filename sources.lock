# Every source the kit builds, pinned: name, version, url, commit.
# Bump a line and push to main: the kit builds and tests it and publishes the rolling release.
#
# ghostty: our release, picked on the fork (congzhangzh/ghostty) as release-<YYYYMMDD>.<N> from
#   integration-windows (upstream main plus the feature-windows branch). The version column
#   is <upstream version>+r<YYYYMMDD>.<N>, e.g. 1.4.1-dev+r20261122.1. (With no ghostty line the
#   kit builds ghostty-base as a baseline and publishes nothing.)
#   r20261122.1: the first release: WGL rendering, the embedded Windows platform and frames,
#   the Win32 host (ghostty.exe), and the Windows fixes they needed (8 commits on main 11ed660).
#   r20261122.2: r20261122.1 plus a fix found dogfooding on an NVIDIA GPU: the driver reported
#   every frame's readback as a debug message from its own thread; with stderr on a pipe nobody
#   drained (Windows PowerShell's 2>) the write blocked and the window stopped responding.
#   r20261122.3: r20261122.2 plus full screen (Ctrl+Enter, F11, or fullscreen = true: the whole
#   monitor, no frame, the taskbar hidden; again restores the window) and GHOSTTY_DEBUG_KEYS,
#   which traces every key message to stderr for keyboard reports.
#   r20261122.4: r20261122.3 plus tabs (the tab bar appears with two tabs, as on macOS; new,
#   close, switch, move, move to a new window) and more than one window, and an Alt+key no
#   longer types its character a second time.
#   r20261122.5: r20261122.4 with the tab bar shown from the first tab, so its + is there to find.
#   r20261122.6: picked (release-20261122.6, fda0cb3cd) but not published: the aarch64 host did
#   not build (the hang and crash reports' stack walk read x86_64-only registers). There is no
#   release 20261122.6: the number is skipped (r20261122.7 went out as tag 20261122.6 for a few
#   minutes, from a count of the day's tags, and was republished as 20261122.7).
#   r20261122.7: r20261122.5 plus the fix for the hang when an unfocused window's renderer
#   could not be woken (termio woke a copy of its Async), a watchdog that writes a hang report,
#   crash reports (a Zig panic raised as a Windows exception) with their stack walk on aarch64
#   too, ghostty.exe /buildinfo, a stats overlay on the inspector key, drawn once per paint,
#   stderr that never blocks the window, and the build in the window title.
#   r20261122.8: r20261122.7 plus Ghostty's themes, shell integration and terminfo in share/
#   beside ghostty.exe, PowerShell as the default shell (pwsh.exe when installed, else Windows
#   PowerShell, else cmd.exe), the stats on a named pipe with ghostty.exe /stats, and the host
#   split into modules.
#   r20261122.9: r20261122.8 plus tabs in the title bar beside Windows' own caption buttons
#   (Windows 11; GHOSTTY_TITLEBAR=system for the classic bar), Microsoft's ConPTY beside
#   ghostty.exe so programs' mouse modes, bracketed paste and kitty keyboard reach the shell
#   unchanged, a translucent stats overlay, the readback's cost in the stats, and
#   GHOSTTY_PRESENT=swap to draw straight into the window (readback stays the default).
#   Built and tested on x86_64 first; aarch64 is built when it can be.
# conpty: Microsoft's console host for pseudoconsoles (conpty.dll + OpenConsole.exe, MIT), the
#   NuGet package Microsoft.Windows.Console.ConPTY; the commit column is the package's SHA-256.
#   ci/build.sh puts both files, unmodified, beside ghostty.exe when the source side-loads them
#   (src/os/conpty.zig); its licence and notices are ci/THIRD-PARTY-NOTICES.txt.
# py-screen: the family line in ghostty.exe's About ("by CZ, an engineer for engineers, near the
#   magnet"), taken by ci/about.py from SLOGAN in src/py_screen/about.py at this commit.
# ghostty-base: the upstream commit the pick sits on. The version column names the upstream
#   branch, so a test build of another commit finds its own base on it.
#
# name          version                url                                                                commit
