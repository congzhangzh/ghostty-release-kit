# conpty: Microsoft's console host for pseudoconsoles (conpty.dll + OpenConsole.exe, MIT), the
#   NuGet package Microsoft.Windows.Console.ConPTY; the commit column is the package's SHA-256.
#   ci/build.sh puts both files, unmodified, beside ghostty.exe when the source side-loads them
#   (src/os/conpty.zig); its licence and notices are ci/THIRD-PARTY-NOTICES.txt.
# mesa-<arch>: Mesa's software OpenGL (llvmpipe, Mesa MIT, LLVM Apache-2.0 WITH LLVM-exception)
#   as mmozeiko/build-mesa builds it, one archive per architecture; the commit column is the
#   archive's SHA-256. ci/build.sh puts its opengl32.dll, unmodified, in opengl\ beside
#   ghostty.exe when the source falls back to it (pkg/opengl/wgl.zig: the system's OpenGL gives
#   no 4.3 core context, as in a VM without a graphics driver); its notices are
