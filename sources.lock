# Every source the kit builds, pinned: name, version, url, commit.
# Bump a line and push to main: the kit builds and tests it and publishes the rolling release.
#
# ghostty: our release, picked on the fork (congzhangzh/ghostty) as release-<YYYYMMDD>.<N> from
#   integration-windows (upstream main plus the feature-windows branch). The version column
#   is <upstream version>+r<YYYYMMDD>.<N>, e.g. 1.4.1-dev+r20261122.1. (With no ghostty line the
#   kit builds ghostty-base as a baseline and publishes nothing.)
#   r20261122.1: the first release: WGL rendering, the embedded Windows platform and frames,
#   the Win32 host (ghostty.exe), and the Windows fixes they needed (8 commits on main 11ed660).
#   r20261122.2: r20261122.1 plus a fix found dogfooding on an NVIDIA GPU: the driver reported
#   every frame's readback as a debug message from its own thread; with stderr on a pipe nobody
#   drained (Windows PowerShell's 2>) the write blocked and the window stopped responding.
#   r20261122.3: r20261122.2 plus full screen (Ctrl+Enter, F11, or fullscreen = true: the whole
#   monitor, no frame, the taskbar hidden; again restores the window) and GHOSTTY_DEBUG_KEYS,
#   which traces every key message to stderr for keyboard reports.
# ghostty-base: the upstream commit the pick sits on. The version column names the upstream
#   branch, so a test build of another commit finds its own base on it.
#
# name          version                url                                                                commit
ghostty         1.4.1-dev+r20261122.3  git+https://github.com/congzhangzh/ghostty.git#release-20261122.3  ec3448b6fce76b63fbebfe92299cf6283a062cea
ghostty-base    main                   git+https://github.com/ghostty-org/ghostty.git#main                11ed660d99fd0dd8dadcaf456db31b71f0f21beb
